# MTMbot configuration - copy to config.toml and edit.
# Every value is validated on load; unknown keys are rejected.

symbol = "BTC/USD"
timeframe = "1h"          # base timeframe: 1m, 5m, 15m, 1h, 4h, 1d ...
starting_cash = 10000.0
# data = "data/BTC-USD_1h.csv"   # default dataset for `mtmbot backtest`

[strategy]
fast_ema = 21
slow_ema = 55
rsi_period = 14
rsi_long_min = 52.0       # long entries need RSI above this
rsi_short_max = 48.0      # short entries need RSI below this
atr_period = 14
atr_stop_mult = 2.0       # stop distance = 2 x ATR
reward_risk = 2.0         # take profit at 2R
htf_factor = 4            # higher timeframe = base timeframe x 4
allow_shorts = true
exit_on_bias_flip = true
breakeven_at_r = 1.0      # move stop to entry at +1R
trail_at_r = 2.0          # start trailing at +2R
trail_atr_mult = 2.0      # trail 2 ATR behind price

[risk]
risk_per_trade_pct = 0.5  # percent of equity risked between entry and stop
max_positions = 1
max_notional_pct = 100.0  # never hold more than 100% of equity in notional
daily_loss_limit_pct = 3.0
max_drawdown_pct = 20.0   # kill switch: latches until manually reset
min_notional = 10.0
max_stop_distance_pct = 10.0

[costs]
taker_bps = 10.0          # 0.10% per fill
slippage_bps = 5.0        # 0.05% adverse slippage per fill

[exchange]                # only used by `mtmbot live`
id = "kraken"
market_type = "spot"
sandbox = true            # start on testnet, always
api_key_env = "MTMBOT_API_KEY"
api_secret_env = "MTMBOT_API_SECRET"
